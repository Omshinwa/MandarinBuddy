  <script>

  function getGoogleUSVoice() {
    const voices = speechSynthesis.getVoices();
    // exact name first, then fuzzy Google+en-US, then any en-US
    return voices.find(v => v.name.toLowerCase() === 'google us english') ||
          voices.find(v => v.name.toLowerCase().includes('google') && /^en(-|_)?us$/i.test(v.lang)) ||
          voices.find(v => /^en(-|_)?us$/i.test(v.lang)) ||
          null;
  }
    function createAudio(string, isEnglish) {
      let audio = new SpeechSynthesisUtterance();
      audio.text = string.replace(/>/g, "").replace(/</g, "");
      if (!isEnglish) {
        audio.lang = "zh";
        audio.rate = 0.7;
        audio.voice = speechSynthesis.getVoices().find(v => v.name.toLowerCase().includes('google') && /^zh/i.test(v.lang))
      } else {
        audio.lang = 'en-US';
        audio.voice = getGoogleUSVoice();
        audio.volume = 0.7;
      }
      console.log(string);
      return audio;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    var allWords
    // READ EVERY WORDS IN THE LIST, TO HELP SLEEPING
    function read_everything() {
      allWords = niveau1
        .concat(niveau2)
        .concat(niveau3)
        .concat(niveau4)
        .concat(niveau5)
        .concat(niveau6)
        .concat(niveau7)
        .concat(niveau8);

      let delay = 0;
      let i = 0;

      playPlaylist(allWords, 0);

      function playPlaylist(playlist, index) {
        let audio;
        if (index % 2 == 1) {
          // chinois
          audio = createAudio(playlist[parseInt(index/2)][0].replace(".", ""), false);
        } else {
          audio = createAudio(playlist[parseInt(index/2)][1], true);
        }

        window.speechSynthesis.speak(audio);
        audio.onend = function () {
          setTimeout(function () {
            playPlaylist(playlist, index + 1);
          }, 1200);
        };
      }
    }
