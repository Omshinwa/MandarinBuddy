  <script type="application/javascript">
    function el(id) {
      return document.getElementById(id);
    } // Get elem by ID
    function print(e) {
      console.log(e);
    }

    function randint(min, max) {
      return Math.floor(Math.random() * (max + 1 - min) + min);
    }

    function get_random_color() {
      var h = randint(1, 360);
      var s = 100;
      var l = randint(20, 80);
      return "hsl(" + h + "," + s + "%," + l + "%)";
    }

    function couleur(niveau) {
      switch (parseInt(niveau)) {
        case 1:
          return "#fff";
          break;
        case 2:
          return "#ddc1ff";
          break;
        case 3:
          return "#99e9fa";
          break;
        case 4:
          return "#91ffc0";
          break;
        case 5:
          return "#fffaab";
          break;
        case 6:
          return "#c10000";
          break;
        case 7:
          return "#222222";
          break;
        case 8:
          return "#fff";
          break;
      }
    }

    function addcolor() {
      document.body.style.backgroundColor = get_random_color();
    }
  </script>

<script type="application/javascript">
  function lire(a) {
    if (a == '0')
      el("text1").value = create_data_0(); //or something similar
    else if (a) {
      let url = "";
      url = "/data/current/data" + a + ".txt";
      //  Backup not implemented in new DB system, defaulting to current or error
      //  Since the server doesn't support backup reads anymore, we could link to current
      //  or handle it. Based on server code, backup file requests return 404 anyway.
      //  Let's assume user wants current if backup is checked for now or fail gracefully.

      $.ajax({
        type: "GET",
        url: url,
        async: false,
        success: function (data) {
          el("text1").value = data; //or something similar
        },
      });
    }
  }

  function overwrite() {
    if (el("niveauAcharger").value) {
      $.ajax({
        type: "POST",
        url: "/overwrite",
        data: {
          niveau: "current/data" + el("niveauAcharger").value,
          data: el("text1").value,
        },
        success: function () {
          addcolor();
        },
      });
    }
  }

  // return a String of all the levels as a sort of back up file.
  function create_data_0()
  {
    let string = ""; //"word count: 1551 // day: 1352@470@0"
    let Nbwords = 0;

    // get data and import them
    for (var i = 1; i < 10; i++) {
      $.ajax({
        type: "GET",
        url: "/data/current/data" + i + ".txt",
        async: false,
        success: function (data) {
          string += "\n------*" + i + "*------\n";
          string += '\n';
          string += data;
          string += '\n';
          Nbwords += data.split("\n").filter(Boolean).length;
          // print(data);
        },
      });
    }
    var jour = 0;
    var step = 0;
    var lastplayed = 0;
    $.ajax({
      type: "GET",
      url: "/jour.txt",
      async: false,
      success: function (data) {
        jour = data.split("@")[1];
        step = data.split("@")[2];
        lastplayed = data.split("@")[0]; //get the date the last time the app was played (its the number of days from 1/1/2022)
        console.log(data);
      },
    });

    let header_str = "word count: " + Nbwords + ", last played: "+lastplayed+" day:"+jour+"@"+step+"\n\n";
    header_str += string;
    return header_str;
  }
</script>
