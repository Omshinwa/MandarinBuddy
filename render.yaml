# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys both halves of MandarinBuddy v2:
#   - mandarinbuddy-server: the Hono API (server/)
#   - mandarinbuddy-web:    the Expo web build served as a static site (app/)
# Render clones the whole repo, so the server's imports from ../shared resolve.
#
# To use: push this repo to GitHub, then in Render → New → Blueprint, pick the
# repo. Render reads this file and creates both services and prompts for every
# env var marked `sync: false` — the server's MONGODB_URI and DEEPSEEK_API_KEY,
# the optional APP_PASSWORD, and the web app's EXPO_PUBLIC_API_URL, which is the
# server's own public URL (Render doesn't know it until the server is created,
# so paste it in and redeploy the web service if it wasn't available yet).
services:
  - type: web
    name: mandarinbuddy-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # MongoDB connection string (e.g. a MongoDB Atlas cluster). The DB name
      # comes from the URI path. Set this in the Render dashboard.
      - key: MONGODB_URI
        sync: false
      # DeepSeek API key for the chat/tutor. Set this in the Render dashboard.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Optional shared password gating every data-changing request. Set it to
      # lock the instance down to yourself; leave it blank for an open demo, and
      # the gate disables itself. Prompted at blueprint creation, never committed.
      - key: APP_PASSWORD
        sync: false

  - type: web
    name: mandarinbuddy-web
    runtime: static
    rootDir: app
    buildCommand: npm install && npm run export:web
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # The server's PUBLIC URL (e.g. https://mandarinbuddy-server.onrender.com),
      # baked into the web bundle at build time. `sync: false` means Render asks
      # for it when the blueprint is created, rather than hardcoding a hostname
      # here — necessary because Render appends a suffix (`-05mt`) whenever the
      # subdomain is already taken, so the real URL isn't known until the server
      # service exists. Create the server first, copy its URL, paste it here.
      #
      # NOTE: don't use `fromService`/`host` instead — for a web service that
      # resolves to the INTERNAL name (`mandarinbuddy-server`), which a browser
      # can't reach. It has to be the full public https URL.
      #
      # Build-time, so changing it later needs a manual redeploy of this service.
      - key: EXPO_PUBLIC_API_URL
        sync: false
    # NOTE: no `routes` rewrite here. A `/* -> /index.html` rewrite on this
    # static site returns an empty (0-byte) body for the root and every
    # rewritten path, which renders as a blank page. The app has no URL-based
    # routing (React Navigation is configured without `linking`), so it doesn't
    # need an SPA deep-link fallback — Render serves dist/index.html at `/` by
    # default. If deep-link fallback is ever needed, re-add routes and verify
    # the root actually serves index.html's body, not an empty 200.
