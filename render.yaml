# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys both halves of SuperAnki v2:
#   - superanki-server: the Hono API (v2/server)
#   - superanki-web:    the Expo web build served as a static site (v2/app)
# Render clones the whole repo, so the server's imports from ../shared resolve.
#
# To use: push this repo to GitHub, then in Render → New → Blueprint, pick the
# repo. Render reads this file and creates both services. Fill in the two secret
# env vars (marked sync:false) on the server when prompted; the web app's API
# URL is wired to the server automatically.
services:
  - type: web
    name: superanki-server
    runtime: node
    plan: free
    rootDir: v2/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # MongoDB connection string (e.g. a MongoDB Atlas cluster). The DB name
      # comes from the URI path. Set this in the Render dashboard.
      - key: MONGODB_URI
        sync: false
      # DeepSeek API key for the chat/tutor. Set this in the Render dashboard.
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: web
    name: superanki-web
    runtime: static
    rootDir: v2/app
    buildCommand: npm install && npm run export:web
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # The server's PUBLIC URL, baked into the web bundle at build time.
      # NOTE: don't use `fromService`/`host` here — for a web service that
      # resolves to the INTERNAL name (`superanki-server`), which a browser
      # can't reach. Set the full public https URL explicitly.
      - key: EXPO_PUBLIC_API_URL
        value: https://superanki-server.onrender.com
    # NOTE: no `routes` rewrite here. A `/* -> /index.html` rewrite on this
    # static site returns an empty (0-byte) body for the root and every
    # rewritten path, which renders as a blank page. The app has no URL-based
    # routing (React Navigation is configured without `linking`), so it doesn't
    # need an SPA deep-link fallback — Render serves dist/index.html at `/` by
    # default. If deep-link fallback is ever needed, re-add routes and verify
    # the root actually serves index.html's body, not an empty 200.
